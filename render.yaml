# Render 部署配置
services:
  - type: web
    name: keling-server
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci --ignore-scripts && npm run prisma:generate --workspace=keling-server -- --schema=prisma/schema.postgresql.prisma && npm run build:server
    # Apply reviewed migrations separately before rollout; free services have no pre-deploy hook.
    startCommand: npm start --workspace=keling-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: keling-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_URL
        value: https://api.deepseek.com/v1/chat/completions

databases:
  - name: keling-db
    region: singapore
    plan: free
